<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystical Arpeggio & Water Ripples</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #050508;
            color: #e2e8f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
        }
        /* Custom styling for sleek frosted glass UI */
        .glass-panel {
            background: rgba(10, 10, 18, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        select, button {
            transition: all 0.2s ease;
        }
        select:hover, button:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }
        /* Settings panel expand/collapse animation */
        #settingsPanel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, padding 0.3s ease-in-out;
            padding-top: 0;
            padding-bottom: 0;
        }
        #settingsPanel.open {
            max-height: 300px;
            opacity: 1;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
    </style>
</head>
<body class="relative h-screen w-screen overflow-hidden">

    <!-- Interactive Canvas for Background Waves & Ripples -->
    <canvas id="artCanvas"></canvas>

    <!-- UI Control Panel -->
    <div class="ui-layer absolute top-0 left-0 w-full p-4 md:p-6 pointer-events-none flex flex-col items-center">
        <header class="glass-panel pointer-events-auto rounded-2xl px-5 py-3 max-w-xl w-full flex flex-col shadow-xl">
            
            <!-- Top Bar with Title and Compact Settings Toggle Button -->
            <div class="flex items-center justify-between w-full">
                <div class="flex items-center space-x-3">
                    <h1 class="text-sm md:text-base font-semibold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-200 via-teal-200 to-cyan-300">
                        Mystical Arpeggio
                    </h1>
                    <span class="hidden sm:inline text-xs text-slate-400">| タップして演奏</span>
                </div>

                <div class="flex items-center gap-2">
                    <!-- Audio Quick Toggle -->
                    <button id="quickAudioBtn" class="bg-indigo-600/60 hover:bg-indigo-600 text-white text-xs font-semibold px-3 py-1.5 rounded-xl border border-indigo-400/30 transition-all">
                        🔊 音声ON
                    </button>
                    <!-- Settings Toggle Button -->
                    <button id="settingsToggleBtn" class="bg-white/10 hover:bg-white/20 text-slate-200 text-xs font-medium px-3 py-1.5 rounded-xl border border-white/10 flex items-center gap-1.5 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>設定</span>
                    </button>
                </div>
            </div>

            <!-- Expandable Detailed Settings Menu -->
            <div id="settingsPanel" class="flex flex-col gap-3 border-t border-white/10 mt-0">
                <p class="text-xs text-slate-400">和音のキーや種類をカスタマイズできます。</p>
                
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <!-- Key Selector -->
                    <div class="flex items-center space-x-2 bg-black/40 px-3 py-1.5 rounded-xl border border-white/15 flex-1 min-w-[130px]">
                        <span class="text-xs text-slate-400 font-medium">Key</span>
                        <select id="keySelect" class="bg-transparent text-sm text-cyan-200 font-semibold focus:outline-none cursor-pointer w-full">
                            <option value="0" class="bg-slate-900">C</option>
                            <option value="1" class="bg-slate-900">C# / Db</option>
                            <option value="2" class="bg-slate-900">D</option>
                            <option value="3" class="bg-slate-900">D# / Eb</option>
                            <option value="4" class="bg-slate-900">E</option>
                            <option value="5" class="bg-slate-900">F</option>
                            <option value="6" class="bg-slate-900">F# / Gb</option>
                            <option value="7" class="bg-slate-900">G</option>
                            <option value="8" class="bg-slate-900">G# / Ab</option>
                            <option value="9" class="bg-slate-900">A</option>
                            <option value="10" class="bg-slate-900">A# / Bb</option>
                            <option value="11" class="bg-slate-900">B</option>
                        </select>
                    </div>

                    <!-- Chord Preset Selector -->
                    <div class="flex items-center space-x-2 bg-black/40 px-3 py-1.5 rounded-xl border border-white/15 flex-1 min-w-[170px]">
                        <span class="text-xs text-slate-400 font-medium">Chord</span>
                        <select id="chordSelect" class="bg-transparent text-sm text-teal-200 font-semibold focus:outline-none cursor-pointer w-full">
                            <option value="maj" class="bg-slate-900">メジャー (Major)</option>
                            <option value="min" class="bg-slate-900">マイナー (Minor)</option>
                            <option value="maj7" class="bg-slate-900">メジャーセブン (Major 7th)</option>
                            <option value="min7" class="bg-slate-900">マイナーセブン (Minor 7th)</option>
                            <option value="dom7" class="bg-slate-900">ドミナントセブン (Dominant 7th)</option>
                            <option value="sus4" class="bg-slate-900">サスフォー (Sus4)</option>
                            <option value="add9" class="bg-slate-900">アドナインス (Add9)</option>
                            <option value="lydian" class="bg-slate-900">リディアン (Lydian)</option>
                            <option value="mystic" class="bg-slate-900">神秘コード (Mystic)</option>
                            <option value="pentatonic" class="bg-slate-900">ペンタトニック (Pentatonic)</option>
                        </select>
                    </div>
                </div>
            </div>

        </header>
    </div>

    <!-- Instructions Toast for first interaction -->
    <div id="welcomeOverlay" class="ui-layer fixed inset-0 pointer-events-none flex items-center justify-center transition-opacity duration-1000">
        <div class="glass-panel px-8 py-5 rounded-3xl text-center max-w-sm mx-4 animate-pulse border border-teal-500/30">
            <div class="text-teal-300 font-medium text-sm mb-1">✨ タップして演奏を開始 ✨</div>
            <p class="text-xs text-slate-400">画面のどこをタッチしても、カラフルな波紋と豊かなアルペジオが広がります。</p>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // --- Web Audio & Synthesizer Setup with Voice Pool & Limiter ---
        let audioCtx = null;
        let masterGain = null;
        let compressor = null;
        let convolver = null;
        let isAudioInitialized = false;

        const activeVoices = [];
        const MAX_VOICES = 36;

        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        
        const CHORD_PRESETS = {
            maj: [0, 4, 7, 11, 14, 19],
            min: [0, 3, 7, 10, 14, 17],
            maj7: [0, 4, 7, 11, 14, 18],
            min7: [0, 3, 7, 10, 14, 17],
            dom7: [0, 4, 7, 10, 14, 17],
            sus4: [0, 5, 7, 12, 14, 17],
            add9: [0, 4, 7, 14, 16, 19],
            lydian: [0, 4, 7, 11, 14, 18],
            mystic: [0, 6, 10, 13, 17, 20],
            pentatonic: [0, 3, 7, 10, 14, 19]
        };

        function initAudio() {
            if (isAudioInitialized) return;
            
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            compressor = audioCtx.createDynamicsCompressor();
            compressor.threshold.setValueAtTime(-12, audioCtx.currentTime);
            compressor.knee.setValueAtTime(3, audioCtx.currentTime);
            compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
            compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
            compressor.release.setValueAtTime(0.25, audioCtx.currentTime);

            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.65;

            createReverbImpulse();

            masterGain.connect(compressor);
            compressor.connect(audioCtx.destination);
            isAudioInitialized = true;

            const overlay = document.getElementById('welcomeOverlay');
            if (overlay) {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 1000);
            }
        }

        function createReverbImpulse() {
            convolver = audioCtx.createConvolver();
            const rate = audioCtx.sampleRate;
            const length = rate * 7.0; 
            const impulse = audioCtx.createBuffer(2, length, rate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);

            for (let i = 0; i < length; i++) {
                const decay = Math.exp(-i / (rate * 2.0));
                left[i] = (Math.random() * 2 - 1) * decay;
                right[i] = (Math.random() * 2 - 1) * decay;
            }

            convolver.buffer = impulse;
            convolver.connect(masterGain);
        }

        function semitoneToFreq(semitones) {
            const baseFreq = 261.63; // C4
            return baseFreq * Math.pow(2, semitones / 12);
        }

        function playNote(freq, panValue, noteIndex, totalNotes, loopIndex) {
            if (!audioCtx || audioCtx.state !== 'running') return;

            if (activeVoices.length >= MAX_VOICES) {
                const oldest = activeVoices.shift();
                try {
                    oldest.gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
                    oldest.gainNode.gain.linearRampToValueAtTime(0.00001, audioCtx.currentTime + 0.05);
                    setTimeout(() => {
                        try { oldest.osc1.stop(); oldest.osc2.stop(); } catch(e){}
                    }, 60);
                } catch(e) {}
            }

            const now = audioCtx.currentTime;
            
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            // ステレオパンナー (StereoPanner) を使用して左右の位置を正確に定位
            const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
            const filter = audioCtx.createBiquadFilter();

            osc1.type = 'sine';
            osc2.type = 'triangle';
            
            osc1.frequency.setValueAtTime(freq, now);
            osc2.frequency.setValueAtTime(freq * 1.002, now);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(2200 + noteIndex * 250, now);
            filter.frequency.exponentialRampToValueAtTime(500, now + 10);

            const attackTime = 0.1 + (noteIndex * 0.06);
            
            // 音の大きさ：1回目そのまま(1.0)、2回目は半分(0.5)、3回目はさらに半分(0.25)、4回目はさらに半分(0.125)
            const loopVolumeMultiplier = Math.pow(0.5, loopIndex);
            const peakGain = (0.18 / Math.sqrt(noteIndex + 1)) * loopVolumeMultiplier;

            noteGain.gain.setValueAtTime(0, now);
            noteGain.gain.linearRampToValueAtTime(peakGain, now + attackTime);
            // 減衰24秒
            noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 24.0);

            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(noteGain);

            if (panner) {
                // タップされた位置（panValue: -1.0=左端, +1.0=右端）を基本に定位させる
                panner.pan.setValueAtTime(panValue, now);
                noteGain.connect(panner);
                panner.connect(masterGain);
                if (convolver) panner.connect(convolver);
            } else {
                noteGain.connect(masterGain);
                if (convolver) noteGain.connect(convolver);
            }

            osc1.start(now);
            osc2.start(now);

            const stopTime = now + 24.5;
            osc1.stop(stopTime);
            osc2.stop(stopTime);

            const voiceObj = { osc1, osc2, gainNode: noteGain };
            activeVoices.push(voiceObj);

            setTimeout(() => {
                const index = activeVoices.indexOf(voiceObj);
                if (index !== -1) activeVoices.splice(index, 1);
            }, 25000);
        }

        function triggerArpeggioSequence(clientX, clientY, normX, normY) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const keyOffset = parseInt(document.getElementById('keySelect').value);
            const chordKey = document.getElementById('chordSelect').value;
            const chordIntervals = CHORD_PRESETS[chordKey] || CHORD_PRESETS.maj;

            const rotationCount = Math.floor(normX * chordIntervals.length);
            const rotatedIntervals = [
                ...chordIntervals.slice(rotationCount),
                ...chordIntervals.slice(0, rotationCount).map(n => n + 12)
            ];

            const octaveShift = normY < 0.33 ? 12 : (normY > 0.66 ? -12 : 0);

            const repeatCount = 4; // 1回目、2回目、3回目、4回目
            
            // スピード倍率：
            // 1回目：そのまま(1.0)
            // 2回目：25%ゆっくり(1.25)
            // 3回目：50%ゆっくり / 半分の速さ(2.0)
            // 4回目：75%ゆっくり(4.0)
            const speedMultipliers = [1.0, 1.25, 2.0, 4.0];
            const baseInterval = 4500; 

            // 画面上の水平位置（0.0=左端, 1.0=右端）をステレオパン用（-1.0〜+1.0）に変換
            const basePan = (normX * 2.0) - 1.0;

            for (let rep = 0; rep < repeatCount; rep++) {
                const speedFactor = speedMultipliers[rep];
                const repDelay = rep * baseInterval * speedFactor;

                // 各回の音のスタートと同時に新しい輪（リップル）を発生させる
                setTimeout(() => {
                    const ripple = new Ripple(clientX, clientY, normX);
                    ripple.speed *= (1 / speedFactor * 0.7 + 0.3);
                    ripples.push(ripple);
                }, repDelay);

                rotatedIntervals.forEach((interval, idx) => {
                    const totalSemitones = keyOffset + interval + octaveShift;
                    const freq = semitoneToFreq(totalSemitones);
                    
                    // 各音ごとに少しだけ広がりを持たせつつ、タップされた位置（左右）を完全に反映
                    const notePan = Math.max(-1, Math.min(1, basePan + ((idx % 2 === 0 ? 1 : -1) * 0.15)));

                    // アルペジオのノート間隔もスピードに合わせてゆっくりに
                    const noteDelay = repDelay + (idx * (250 * speedFactor));

                    setTimeout(() => {
                        playNote(freq, notePan, idx, rotatedIntervals.length, rep);
                    }, noteDelay);
                });
            }
        }

        // --- Canvas & Visual Art Engine ---
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let ripples = [];
        let particles = [];
        let backgroundTime = 0;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.baseAlpha = Math.random() * 0.3 + 0.1;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2 - 0.1;
                this.phase = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.phase += 0.015;
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }
            draw() {
                const alpha = this.baseAlpha + Math.sin(this.phase) * 0.15;
                ctx.fillStyle = `rgba(200, 225, 255, ${Math.max(0.05, alpha)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 60; i++) {
            particles.push(new Particle());
        }

        class Ripple {
            constructor(x, y, normX) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = Math.max(width, height) * 0.85;
                this.life = 1.0;
                this.speed = 2.5 + normX * 1.2; 
                this.hue = (normX * 360 + Math.random() * 60) % 360; 
            }
            update() {
                this.radius += this.speed;
                this.life -= 0.0035; 
            }
            draw() {
                if (this.life <= 0) return;
                
                const alpha = Math.max(0, this.life * 0.65);
                
                for (let i = 0; i < 4; i++) {
                    const ringRadius = this.radius - (i * 30);
                    if (ringRadius > 0) {
                        const ringAlpha = alpha * (1 - i * 0.22);
                        const currentRingHue = (this.hue + i * 40) % 360;
                        
                        ctx.strokeStyle = `hsla(${currentRingHue}, 90%, 70%, ${ringAlpha})`;
                        ctx.lineWidth = Math.max(1.5, 4.2 - (i * 0.8));
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, ringRadius, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }

                if (this.radius < 70) {
                    const centerAlpha = (1 - this.radius / 70) * 0.4;
                    ctx.fillStyle = `hsla(${this.hue}, 95%, 75%, ${centerAlpha})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 20, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function animate() {
            backgroundTime += 0.0025;

            const baseHue1 = (220 + Math.sin(backgroundTime * 0.4) * 35) % 360;
            const baseHue2 = (270 + Math.cos(backgroundTime * 0.3) * 30) % 360;

            const grad = ctx.createRadialGradient(
                width * 0.5 + Math.sin(backgroundTime * 0.5) * 150,
                height * 0.5 + Math.cos(backgroundTime * 0.3) * 100,
                50,
                width * 0.5,
                height * 0.5,
                Math.max(width, height)
            );
            grad.addColorStop(0, `hsla(${baseHue1}, 35%, 6%, 1)`);
            grad.addColorStop(0.5, `hsla(${baseHue2}, 30%, 4%, 1)`);
            grad.addColorStop(1, '#020204');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            const glowX = width * 0.5 + Math.sin(backgroundTime) * (width * 0.25);
            const glowY = height * 0.5 + Math.cos(backgroundTime * 0.7) * (height * 0.25);
            const bgGlow = ctx.createRadialGradient(glowX, glowY, 10, glowX, glowY, width * 0.65);
            bgGlow.addColorStop(0, `hsla(${(baseHue1 + 60) % 360}, 60%, 25%, 0.12)`);
            bgGlow.addColorStop(0.5, `hsla(${(baseHue2 + 40) % 360}, 50%, 15%, 0.04)`);
            bgGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].life <= 0) {
                    ripples.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // --- Event Listeners & UI Controls ---
        function handleInteraction(clientX, clientY) {
            const headerEl = document.querySelector('header');
            const rect = headerEl.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
                return;
            }

            const normX = clientX / width;
            const normY = clientY / height;

            triggerArpeggioSequence(clientX, clientY, normX, normY);
        }

        window.addEventListener('click', (e) => {
            handleInteraction(e.clientX, e.clientY);
        });

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleInteraction(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // Settings Menu Toggle
        const settingsToggleBtn = document.getElementById('settingsToggleBtn');
        const settingsPanel = document.getElementById('settingsPanel');

        settingsToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPanel.classList.toggle('open');
        });

        // Quick Audio Button Handler
        document.getElementById('quickAudioBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const btn = e.target;
            const originalText = btn.innerText;
            btn.innerText = '✨ 準備完了 ✨';
            setTimeout(() => {
                btn.innerText = originalText;
            }, 1500);
        });

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
